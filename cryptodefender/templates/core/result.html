<!DOCTYPE html>
<html>
<head>
    <title>Detection Result — CryptoDefender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink:    #0d0d0d;
            --card:   #ffffff;
            --accent: #ff4d1c;
            --accent2:#ffb347;
            --muted:  #6b6b6b;
            --bg:     #f0ede8;
            --safe:   #16a34a;
            --danger: #e03e3e;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--ink);
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .5;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 620px; height: 620px;
            background: radial-gradient(circle, #ff4d1c 0%, #ffb347 60%, transparent 100%);
            top: -220px; right: -220px;
            animation: drift 9s ease-in-out infinite alternate;
        }
        body::after {
            width: 460px; height: 460px;
            background: radial-gradient(circle, #a78bfa 0%, #60a5fa 60%, transparent 100%);
            bottom: -160px; left: -140px;
            animation: drift 11s ease-in-out infinite alternate-reverse;
        }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 20px) scale(1.06); }
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 640px;
            margin: 0 auto;
            padding: 70px 24px 90px;
        }

        .head {
            text-align: center;
            margin-bottom: 34px;
            animation: rise .6s cubic-bezier(.22,.68,0,1.2) both;
        }
        .head .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: 999px;
            background: rgba(255,77,28,.1);
            border: 1px solid rgba(255,77,28,.25);
            color: var(--accent);
            font-size: .76rem;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        .head h2 {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -.5px;
        }
        .head p {
            color: var(--muted);
            font-size: .92rem;
            margin-top: 8px;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── result card ── */
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 34px;
            box-shadow: 0 24px 60px rgba(0,0,0,.1), 0 0 0 1px rgba(0,0,0,.03);
            animation: rise .6s cubic-bezier(.22,.68,0,1.2) .1s both;
        }

        .metric-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
            margin-bottom: 26px;
        }
        .metric {
            background: #f7f7f5;
            border-radius: 14px;
            padding: 18px 14px;
            text-align: center;
        }
        .metric .label {
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .metric .value {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.55rem;
        }
        .metric .bar-track {
            width: 100%;
            height: 5px;
            border-radius: 4px;
            background: #e6e4df;
            margin-top: 10px;
            overflow: hidden;
        }
        .metric .bar-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            animation: fillBar 1s ease-out both;
        }
        @keyframes fillBar {
            from { width: 0%; }
        }

        .net-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding-top: 22px;
            margin-top: 22px;
            border-top: 1px solid #ececea;
        }
        .net-metric {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f7f7f5;
            border-radius: 14px;
            padding: 14px 16px;
        }
        .net-metric .icon-box {
            width: 34px; height: 34px;
            border-radius: 8px;
            background: rgba(255,77,28,.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .net-metric .icon-box svg { width: 16px; height: 16px; stroke: var(--accent); }
        .net-metric .label {
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
        }
        .net-metric .value {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
        }

        /* ── verdict banner ── */
        .verdict {
            margin-top: 24px;
            padding: 20px 22px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
        }
        .verdict.is-safe {
            background: rgba(22,163,74,.08);
            border: 1px solid rgba(22,163,74,.25);
            color: var(--safe);
        }
        .verdict.is-danger {
            background: rgba(224,62,62,.08);
            border: 1px solid rgba(224,62,62,.25);
            color: var(--danger);
        }
        .verdict .icon-circle {
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .verdict.is-safe .icon-circle { background: var(--safe); }
        .verdict.is-danger .icon-circle { background: var(--danger); }
        .verdict .icon-circle svg { width: 18px; height: 18px; stroke: #fff; }

        /* ── actions ── */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 28px;
        }

        .btn-prevent {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #f1f1ef;
            color: #9a9a94;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: .95rem;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-prevent svg { width: 15px; height: 15px; }

        .btn-back {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #e2e2e2;
            border-radius: 12px;
            background: transparent;
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: .92rem;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: background .2s, border-color .2s;
        }
        .btn-back:hover {
            background: #f7f7f5;
            border-color: #d5d5d0;
        }

        @media (max-width: 480px) {
            .metric-group { grid-template-columns: 1fr; }
            .net-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="wrap">

    <div class="head">
        <div class="eyebrow">Scan complete</div>
        <h2>Detection Result</h2>
        <p>Snapshot of your system's current resource activity</p>
    </div>

    <div class="card">

        <div class="metric-group">
            <div class="metric">
                <div class="label">CPU</div>
                <div class="value">{{ cpu }}%</div>
                <div class="bar-track"><div class="bar-fill" style="width: {{ cpu }}%;"></div></div>
            </div>
            <div class="metric">
                <div class="label">RAM</div>
                <div class="value">{{ ram }}%</div>
                <div class="bar-track"><div class="bar-fill" style="width: {{ ram }}%;"></div></div>
            </div>
            <div class="metric">
                <div class="label">Disk</div>
                <div class="value">{{ disk }}%</div>
                <div class="bar-track"><div class="bar-fill" style="width: {{ disk }}%;"></div></div>
            </div>
        </div>

        <div class="net-group">
            <div class="net-metric">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"/>
                        <polyline points="5 12 12 5 19 12"/>
                    </svg>
                </div>
                <div>
                    <div class="label">Upload Speed</div>
                    <div class="value">{{ upload }} KB/s</div>
                </div>
            </div>
            <div class="net-metric">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <polyline points="19 12 12 19 5 12"/>
                    </svg>
                </div>
                <div>
                    <div class="label">Download Speed</div>
                    <div class="value">{{ download }} KB/s</div>
                </div>
            </div>
        </div>

        <!-- Verdict banner: toggle is-safe / is-danger from your view based on {{ result }} -->
        {% if is_threat %}
        <div class="verdict is-danger">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                </svg>
            </div>
            <span>{{ result }}</span>
        </div>
        {% else %}
        <div class="verdict is-safe">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6L9 17l-5-5"/>
                </svg>
            </div>
            <span>{{ result }}</span>
        </div>
        {% endif %}

    </div>

    <div class="actions">
        <button class="btn-prevent" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="11" width="14" height="9" rx="2"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            Prevent — Login Required
        </button>

        <a href="/" class="btn-back">← Back to Home</a>
    </div>

</div>

</body>
</html>
