<!DOCTYPE html>

<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark p-3">
    <span class="navbar-brand">Admin Panel</span>
    <div>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-light">Global</a>
        <a href="{% url 'manage_admins' %}" class="btn btn-warning">Admin</a>
        <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
    </div>
</nav>

<div class="container mt-4">

<h3>User Details</h3>

<form method="get">
    <input type="text" name="q" placeholder="Search username..." class="form-control mb-3">
</form>

<table class="table table-bordered">
<tr>
<th>Username</th>
<th>Date Joined</th>
</tr>

{% for user in users %}

<tr>
<td>{{ user.username }}</td>
<td>{{ user.date_joined }}</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
